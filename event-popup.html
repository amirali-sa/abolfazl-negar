<!-- ================= دکمه و پاپ‌آپ «اطلاعات مراسم» v3 ================= -->
<link rel="stylesheet" href="/event-popup.css" />

<div class="loc-trigger-wrap">
    <button id="evOpenBtn" type="button">
        <span class="loc-trigger-pin">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        </span>
        اطلاعات مراسم و موقعیت مکانی
    </button>
</div>

<div id="evOverlay">
    <div id="evDialog" dir="rtl">
        <div class="ev-header">
            <span style="width:28px"></span>
            <div class="ev-title">اطلاعات مراسم</div>
            <button type="button" class="ev-close" id="evCloseBtn" aria-label="بستن">&#10005;</button>
        </div>

        <div class="ev-poem">به سنت عشق گرد هم می‌آییم
آنجا که دوست داشتن تنها کلام زندگی است</div>

        <img class="ev-divider" src="/divider.svg" alt="">

        <div class="ev-sec-title">زمان باقی‌مانده</div>
        <div class="ev-countdown">
            <div class="ev-cd-box"><div class="ev-cd-num" id="evCdDays">۰۰</div><div class="ev-cd-label">روز</div></div>
            <div class="ev-cd-box"><div class="ev-cd-num" id="evCdHours">۰۰</div><div class="ev-cd-label">ساعت</div></div>
            <div class="ev-cd-box"><div class="ev-cd-num" id="evCdMins">۰۰</div><div class="ev-cd-label">دقیقه</div></div>
            <div class="ev-cd-box"><div class="ev-cd-num" id="evCdSecs">۰۰</div><div class="ev-cd-label">ثانیه</div></div>
        </div>
        <div class="ev-date-note">یکشنبه <b>۲۹ شهریور ۱۴۰۵</b> — از ساعت <b>۱۹</b> تا پاسی از شب<br><b>باغ تالار رویال</b></div>

        <img class="ev-divider" src="/divider.svg" alt="">

        <div class="ev-sec-title">موقعیت مکانی</div>
        <a class="ev-map" href="https://balad.ir/p/4fgcNYkISu0GwU?preview=true#17.27/32.713176/51.767907" target="_blank" rel="noopener">
            <img src="/img/map-preview.png" alt="پیش‌نمایش نقشه باغ تالار رویال">
        </a>

        <div class="ev-sec-title" style="margin-top:18px">مسیریابی</div>
        <div class="ev-routing">
            <a class="ev-route-btn" href="https://www.google.com/maps/search/?api=1&query=32.7126426%2C51.7677154" target="_blank" rel="noopener" title="گوگل مپ">
                <img src="/icon-google-map.svg" alt="گوگل مپ">
            </a>
            <a class="ev-route-btn" href="https://waze.com/ul?ll=32.7126426%2C51.7677154&navigate=yes" target="_blank" rel="noopener" title="ویز">
                <img src="/icon-waze.svg" alt="ویز">
            </a>
            <a class="ev-route-btn" href="https://neshan.org/maps/@32.7126426,51.7677154,16z" target="_blank" rel="noopener" title="نشان">
                <img src="/icon-neshan.svg" alt="نشان">
            </a>
            <a class="ev-route-btn" href="https://balad.ir/location?latitude=32.7126426&longitude=51.7677154&zoom=16&title=%D8%A8%D8%A7%D8%BA%20%D8%AA%D8%A7%D9%84%D8%A7%D8%B1%20%D8%B1%D9%88%DB%8C%D8%A7%D9%84" target="_blank" rel="noopener" title="بلد">
                <img src="/icon-balad.svg" alt="بلد">
            </a>
        </div>

        <div class="ev-address">اصفهان — باغ تالار رویال</div>

        <img class="ev-divider" src="/divider.svg" alt="">

        <form class="ev-form" id="evForm" novalidate>
            <div class="ev-field">
                <label for="evName"><span class="req">*</span> نام خود را وارد کنید</label>
                <input type="text" id="evName" name="name" autocomplete="name">
                <div class="ev-error" id="evNameError">لطفاً نام خود را وارد کنید</div>
            </div>
            <div class="ev-field">
                <label for="evMessage">به رسم یادبود، پیامی بنویسید</label>
                <textarea id="evMessage" name="message"></textarea>
            </div>
            <button type="submit" class="ev-submit">ثبت اطلاعات</button>
        </form>

        <div class="ev-success" id="evSuccess">
            <svg viewBox="0 0 128 128">
                <circle cx="64" cy="64" r="56" fill="none" stroke="#4CAF50" stroke-width="4"/>
                <polyline class="check" fill="none" stroke="#4CAF50" stroke-width="8" points="40 66 56 82 88 50"/>
            </svg>
            <div>اطلاعات با موفقیت ثبت شد</div>
        </div>
    </div>
</div>

<script src="/event-popup.js"></script>
<!-- ================= پایان پاپ‌آپ ================= -->
